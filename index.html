<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Real-time weather dashboard using Fetch API and Open-Meteo."><title>WeatherNow — Weather Dashboard</title><style>
:root{--bg:#07111f;--card:#0d1b2a;--card2:#13263a;--text:#f8fafc;--muted:#a8b6c7;--accent:#38bdf8;--border:#244057;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0%,#38bdf825,transparent 28rem),radial-gradient(circle at 90% 20%,#818cf821,transparent 25rem),var(--bg)}button,input{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.container{width:min(calc(100% - 2rem),1100px);margin:auto}header{padding:48px 0 24px}.eyebrow{margin:0 0 8px;color:var(--accent);font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(2.5rem,7vw,4.8rem);line-height:1;letter-spacing:-.05em}.subtitle{color:var(--muted)}.search{display:grid;grid-template-columns:1fr auto;gap:10px;margin:24px 0}.search input{min-width:0;padding:15px 16px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text)}.search button{border:0;border-radius:14px;padding:15px 22px;background:var(--accent);color:#062033;font-weight:900}.search button:disabled{opacity:.6;cursor:wait}.status{min-height:24px;color:var(--muted)}.status.error{color:var(--danger)}.dashboard{display:grid;gap:16px}.card{background:#0d1b2ae8;border:1px solid var(--border);border-radius:22px;padding:22px}.current{display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:center}.location{color:var(--muted);margin:0}.temperature{font-size:clamp(4rem,12vw,7rem);font-weight:900;line-height:.95;letter-spacing:-.07em;margin:14px 0}.condition{font-size:1.2rem;font-weight:800}.weather-icon{font-size:5rem;text-align:center}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--card2)}.metric dt{color:var(--muted);font-size:.8rem}.metric dd{margin:5px 0 0;font-size:1.2rem;font-weight:850}.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.day{padding:16px 12px;border:1px solid var(--border);border-radius:16px;background:var(--card2);text-align:center}.day strong{display:block;margin-bottom:8px}.day .emoji{font-size:2rem}.day .temp{font-weight:900;margin-top:8px}.day small{color:var(--muted)}.section-title{margin:0 0 14px;font-size:1.15rem}.welcome{text-align:center;padding:45px 20px;color:var(--muted)}.hidden{display:none!important}footer{padding:28px 0 45px;color:var(--muted);font-size:.85rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:720px){.current{grid-template-columns:1fr;text-align:center}.metrics{grid-template-columns:repeat(2,1fr)}.forecast{grid-template-columns:1fr 1fr}}@media(max-width:480px){header{padding-top:30px}.search{grid-template-columns:1fr}.search button{width:100%}.forecast{grid-template-columns:1fr}}
</style></head><body><main class="container"><header><p class="eyebrow">Live Weather Dashboard</p><h1>WeatherNow</h1><p class="subtitle">Search any city for current conditions and a five-day forecast.</p><form class="search" id="search-form"><label class="sr-only" for="city-input">City name</label><input id="city-input" type="search" maxlength="80" placeholder="Enter a city, e.g. Bengaluru" autocomplete="address-level2" required><button id="search-button" type="submit">Search weather</button></form><p id="status" class="status" aria-live="polite"></p></header><section id="dashboard" class="dashboard hidden" aria-live="polite"></section><section id="welcome" class="card welcome"><h2>Check the weather</h2><p>Enter a city above. This app uses public Open-Meteo REST APIs, so no API key is required.</p></section><footer>Weather data provided by Open-Meteo.</footer></main><script>
const form=document.querySelector('#search-form'),input=document.querySelector('#city-input'),button=document.querySelector('#search-button'),status=document.querySelector('#status'),dashboard=document.querySelector('#dashboard'),welcome=document.querySelector('#welcome');
const codes={0:['☀️','Clear sky'],1:['🌤️','Mainly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫️','Fog'],48:['🌫️','Rime fog'],51:['🌦️','Light drizzle'],53:['🌦️','Moderate drizzle'],55:['🌧️','Dense drizzle'],61:['🌦️','Slight rain'],63:['🌧️','Moderate rain'],65:['🌧️','Heavy rain'],71:['🌨️','Slight snow'],73:['🌨️','Moderate snow'],75:['❄️','Heavy snow'],80:['🌦️','Rain showers'],81:['🌧️','Moderate rain showers'],82:['⛈️','Violent rain showers'],85:['🌨️','Snow showers'],86:['❄️','Heavy snow showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm with hail'],99:['⛈️','Thunderstorm with heavy hail']};
const desc=code=>codes[code]||['🌡️','Unknown conditions'];
function setStatus(msg='',error=false){status.textContent=msg;status.classList.toggle('error',error)}
function day(s){return new Intl.DateTimeFormat(undefined,{weekday:'short'}).format(new Date(s+'T12:00:00'))}
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error(`Request failed (HTTP ${r.status}).`);return r.json()}
async function geocode(city){const u=new URL('https://geocoding-api.open-meteo.com/v1/search');u.searchParams.set('name',city);u.searchParams.set('count','1');u.searchParams.set('language','en');u.searchParams.set('format','json');const d=await getJSON(u);if(!d.results?.length)throw new Error(`No city named “${city}” was found.`);return d.results[0]}
async function forecast(lat,lon){const u=new URL('https://api.open-meteo.com/v1/forecast');u.searchParams.set('latitude',lat);u.searchParams.set('longitude',lon);u.searchParams.set('current','temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m');u.searchParams.set('daily','weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max');u.searchParams.set('timezone','auto');u.searchParams.set('forecast_days','5');return getJSON(u)}
function metric(label,value){const d=document.createElement('div');d.className='metric';d.innerHTML=`<dt>${label}</dt><dd>${value}</dd>`;return d}
function render(place,data){dashboard.replaceChildren();const c=data.current,[icon,text]=desc(c.weather_code);const current=document.createElement('article');current.className='card current';const info=document.createElement('div');info.innerHTML=`<p class="location">${[place.name,place.admin1,place.country].filter(Boolean).join(', ')}</p><div class="temperature">${Math.round(c.temperature_2m)}°C</div><p class="condition">${text}</p><small>Feels like ${Math.round(c.apparent_temperature)}°C</small>`;const visual=document.createElement('div');visual.className='weather-icon';visual.setAttribute('aria-hidden','true');visual.textContent=icon;current.append(info,visual);const details=document.createElement('section');details.className='card';details.innerHTML='<h2 class="section-title">Current details</h2>';const dl=document.createElement('dl');dl.className='metrics';dl.append(metric('Humidity',Math.round(c.relative_humidity_2m)+'%'),metric('Wind',Math.round(c.wind_speed_10m)+' km/h'),metric('Precipitation',Number(c.precipitation).toFixed(1)+' mm'),metric('Time',c.is_day?'Day':'Night'));details.append(dl);const fc=document.createElement('section');fc.className='card';fc.innerHTML='<h2 class="section-title">Five-day forecast</h2>';const grid=document.createElement('div');grid.className='forecast';data.daily.time.forEach((date,i)=>{const [ico,descText]=desc(data.daily.weather_code[i]);const d=document.createElement('article');d.className='day';d.innerHTML=`<strong>${day(date)}</strong><div class="emoji" aria-label="${descText}">${ico}</div><div class="temp">${Math.round(data.daily.temperature_2m_max[i])}° / ${Math.round(data.daily.temperature_2m_min[i])}°</div><small>${data.daily.precipitation_probability_max[i]??0}% rain</small>`;grid.append(d)});fc.append(grid);dashboard.append(current,details,fc);welcome.classList.add('hidden');dashboard.classList.remove('hidden')}
async function searchWeather(city){const clean=city.trim();if(!clean){setStatus('Please enter a city name.',true);input.focus();return}button.disabled=true;button.textContent='Loading…';setStatus('Finding the city and fetching live weather…');try{const place=await geocode(clean);const data=await forecast(place.latitude,place.longitude);render(place,data);setStatus(`Weather loaded for ${place.name}.`)}catch(e){console.error(e);dashboard.classList.add('hidden');welcome.classList.remove('hidden');setStatus(e instanceof TypeError?'Network error. Check your internet connection and try again.':e.message||'Unable to fetch weather.',true)}finally{button.disabled=false;button.textContent='Search weather'}}
form.addEventListener('submit',e=>{e.preventDefault();searchWeather(input.value)});searchWeather('Bengaluru');
</script></body></html>
